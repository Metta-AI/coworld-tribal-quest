name: Quest component CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Nimby and Nim
        run: |
          curl -fsSL -o /usr/local/bin/nimby \
            https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x /usr/local/bin/nimby
          nimby use 2.2.10
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"

      - name: Check out the locked Fortress engine
        uses: actions/checkout@v4
        with:
          repository: Metta-AI/coworld-tribal-fortress
          path: fortress

      - name: Select the locked Fortress revision
        run: |
          fortress_ref=$(tr -d '\n' < fortress.lock)
          git -C fortress checkout "$fortress_ref"

      - name: Install dependencies
        run: |
          nimby sync -g fortress/nimby.lock
          nimble refresh
          nimble install -y --depsOnly

      - name: Validate component descriptor
        run: python3 scripts/validate_component.py

      - name: Run unit tests
        run: |
          nim r --path:src tests/tests.nim
          python3 tests/test_http_artifacts.py

      - name: Compile and smoke with the exact Fortress engine
        env:
          REQUIRE_LOCKED_FORTRESS: "1"
          TRIBAL_FORTRESS_PATH: ${{ github.workspace }}/fortress
        run: bash scripts/test_with_fortress.sh

      - name: Check formatting and whitespace
        run: |
          find src players tests -name '*.nim' -print0 | xargs -0 nimpretty
          git diff --exit-code
          git diff --check

      - name: Build development image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=github_token,env=GITHUB_TOKEN \
            --tag tribal-quest-component:test .
